version: 2

project_name: wslpp

before:
  hooks:
    - go mod tidy
    - sh -c 'cd ui && corepack pnpm install --frozen-lockfile && corepack pnpm run build'

builds:
  - id: wslpp
    main: .
    binary: wslpp
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
      - -tags=embedui
    ldflags:
      - -s -w
      - -X github.com/HobaiRiku/wsl2-auto-portproxy/internal/version.Version={{ .Version }}
      - -X github.com/HobaiRiku/wsl2-auto-portproxy/internal/version.Commit={{ .Commit }}
      - -X github.com/HobaiRiku/wsl2-auto-portproxy/internal/version.BuildDate={{ .Date }}
    goos:
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    ids:
      - wslpp
    formats:
      - zip
    files:
      - LICENSE
      - README.md

checksum:
  name_template: SHA256SUMS

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

release:
  prerelease: auto
