name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npm run build
        working-directory: ui
      - run: go test -race ./...
      - run: go vet -tags embedui ./...
      - run: go build -trimpath -tags embedui -o dist/wslpp${{ runner.os == 'Windows' && '.exe' || '' }} .
      - run: git diff --exit-code -- go.mod go.sum ui/package-lock.json
  windows-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: make release
      - uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: dist/
