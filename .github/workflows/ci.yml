name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: gofmt
        run: make fmt-check

      # vet also type-checks the Windows-only files from Linux.
      - name: go vet
        run: make vet

      - name: go test (race)
        run: make race

  ui:
    name: ui and embedded build
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Type check and lint
        run: make ui-lint

      - name: Build windows/amd64 and windows/arm64 with embedded UI
        run: make dist

      - name: Lockfiles unchanged
        run: git diff --exit-code -- go.mod go.sum ui/pnpm-lock.yaml
